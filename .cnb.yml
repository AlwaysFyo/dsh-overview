# CNB dsh-overview → GitHub 镜像流水线
#
# push: main 后先对齐本地 branches/tags，再由 tencentcom/git-sync 推送。
# 目标是精确镜像：GitHub 侧多出的分支/标签会在对齐阶段删掉（插件自身没有 prune）。
# 凭据 GITHUB_USERNAME / GITHUB_TOKEN 由密钥仓库 ${CNB_ROOT_SLUG}/secrets 注入。
# 镜像前先跑 test：红提交不进 GitHub。

.mirror-job: &mirror-job
  name: mirror-to-github
  runner:
    cpus: 2
  imports:
    - https://cnb.cool/${CNB_ROOT_SLUG}/secrets/-/blob/main/secrets.yml
  lock:
    key: mirror-github
    wait: true
    cancel-in-wait: true
  stages:
    - name: test
      image: node:24
      script: |
        set -eu
        npm ci
        npm run check
        npm test

    # 插件只推工作区里已有的本地 ref：先与 CNB 对齐，再清理 GitHub 侧已删除的 ref。
    - name: align
      image: node:24
      script: |
        set -eu
        git config --global --add safe.directory '*'

        _target="https://github.com/${GITHUB_USERNAME}/${CNB_REPO_NAME}.git"
        _cred='!f() { echo username="$GITHUB_USERNAME"; echo password="$GITHUB_TOKEN"; }; f'

        # 浅克隆推出去会让 GitHub 侧历史残缺
        [ "$(git rev-parse --is-shallow-repository)" != "true" ] || git fetch --unshallow origin

        # 1) 对齐本地 ref（分支和标签都拉到 CNB 的当前状态）
        git fetch origin --prune --update-head-ok \
          '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'

        # 2) 校验：本地 ref 与 CNB 逐条一致（SHA 也相同）
        git for-each-ref --format='%(objectname) %(refname)' refs/heads refs/tags | sort > /tmp/local.refs
        git ls-remote --heads --tags origin > /tmp/origin.raw
        grep -vF '^{}' /tmp/origin.raw | tr '\t' ' ' | sort > /tmp/origin.refs
        diff -q /tmp/local.refs /tmp/origin.refs >/dev/null || {
          echo "✗ 本地 ref 与 CNB 不一致：" >&2
          diff /tmp/local.refs /tmp/origin.refs >&2 || true
          exit 1
        }

        # 3) 清理 GitHub 侧 CNB 已不存在的 ref（git-sync 没有 prune）
        git -c credential.helper="$_cred" ls-remote --heads --tags "$_target" > /tmp/target.raw
        cut -f2 /tmp/target.raw | grep -vF '^{}' | sort > /tmp/target.refs
        while read -r _ref; do
          git rev-parse --verify -q "$_ref" >/dev/null && continue
          echo "· 删除 GitHub 上多余 ref: $_ref"
          git -c credential.helper="$_cred" push "$_target" ":$_ref" < /dev/null
        done < /tmp/target.refs

    - name: mirror
      image: tencentcom/git-sync
      settings:
        target_url: https://github.com/${GITHUB_USERNAME}/${CNB_REPO_NAME}.git
        auth_type: https
        username: ${GITHUB_USERNAME}
        password: ${GITHUB_TOKEN}
        force: true
        push_tags: true

main:
  push:
    - *mirror-job
